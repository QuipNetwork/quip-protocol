[workspace]
resolver = "2"
members = [
    "quip-proto",
    "quip-protocol",
    "quip-mock-miner",
    "quip-mock-coordinator",
    "quip-coordinator",
    "quip-miner-core",
    "quip-miner-metal",
    "quip-miner-cpu",
    "quip-miner-cuda",
]
# quip-protocol-py is a PyO3 extension built by maturin (needs a Python
# interpreter); keep it out of the plain `cargo build --workspace` gate.
exclude = ["quip-protocol-py"]

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tonic-build = "0.12"

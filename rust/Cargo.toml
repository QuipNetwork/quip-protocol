[workspace]
resolver = "2"
members = ["quip-proto", "quip-protocol", "quip-mock-miner"]
# quip-mock-coordinator is added by a later task as its crate lands;
# listing not-yet-created members breaks `cargo` entirely.

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tonic-build = "0.12"

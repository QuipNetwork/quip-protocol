[package]
name = "quip-coordinator"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "quip-coordinator"
path = "src/main.rs"

[lib]
name = "quip_coordinator"
path = "src/lib.rs"

[dependencies]
quip-proto = { path = "../quip-proto" }
quip-protocol = { path = "../quip-protocol" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
getrandom = "0.2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

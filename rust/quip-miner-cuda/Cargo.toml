[package]
name = "quip-miner-cuda"
version = "0.3.0"
edition = "2021"
description = "CUDA Ising miners: simulated annealing and heat-bath Gibbs (v0.3)"

[lib]
name = "quip_miner_cuda"
path = "src/lib.rs"

[[bin]]
name = "quip-cuda-sa"
path = "src/bin/quip_cuda_sa.rs"

[[bin]]
name = "quip-cuda-gibbs"
path = "src/bin/quip_cuda_gibbs.rs"

[dependencies]
quip-proto = { path = "../quip-proto" }
quip-protocol = { path = "../quip-protocol" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
# NVRTC JIT + driver launch; pin CUDA 13.2 bindings to match /usr/local/cuda.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-13020",
    "dynamic-loading",
] }
nvml-wrapper = "0.11"
thiserror = "2"

[dev-dependencies]
quip-mock-coordinator = { path = "../quip-mock-coordinator" }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "quip_proto"
version = "0.3.0"
description = "quip.network v0.3 SDK: PyO3 consensus primitives + generated gRPC stubs"
requires-python = ">=3.11"
# The bundled quip.v1 gRPC stubs need these at runtime.
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[tool.maturin]
manifest-path = "../rust/quip-protocol-py/Cargo.toml"
python-source = "."
module-name = "quip_proto._core"
features = ["pyo3/extension-module"]
# maturin only auto-bundles the package matching module-name (quip_proto).
# The generated gRPC stubs live in the sibling `quip` package, which
# `quip_proto/__init__.py` imports (`from quip.v1 import ...`); include it so
# the wheel is self-contained when installed off-tree (e.g. git+ deps).
include = [{ path = "quip/**/*.py", format = "wheel" }]

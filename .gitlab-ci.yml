# GitLab CI/CD for Quip Network Node
# Tests on branches; image + binary pushes on git tags ONLY

stages:
  - test
  - build

# NOTE (v0.3 cutover): the v0.2 image/binary jobs were removed (they built the
# deleted Python monolith). The v0.3 images below live under a SEPARATE
# namespace (v0.3/) so they never touch the v0.2 :latest/:v0.2 tags that
# quip-node-manager tracks — the full cutover of those tags is deferred. Images
# bundle the released miner binaries + a from-source coordinator; the
# coordinator's production runtime is still being wired (quip-6ha/4kn/agm).

# ---------------------------------------------------------------------------
# Tests (branches only — main/tags skip straight to build)
# ---------------------------------------------------------------------------

# The v0.2 Python `test:` job (pytest tests/) was removed in the v0.3 cutover —
# the Python miner stack it exercised is gone. v0.3 coverage is `rust:` (the
# workspace) and `conformance:` (the quip_proto SDK).

rust:
  stage: test
  image: rust:1.97
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - cd rust
    - cargo fmt --all --check
    - cargo clippy --workspace --exclude quip-coordinator --all-targets -- -D warnings
    - cargo test --workspace --exclude quip-coordinator
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [rust/target/, .cargo/]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

conformance:
  stage: test
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    # quip-proto's build script (prost/tonic) needs protoc; python:3.11 has none.
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
    # maturin develop requires an active virtualenv; the base image has none.
    - python -m venv .venv
    - . .venv/bin/activate
    # Pin grpcio-tools so the proto-stub drift guard is deterministic: the
    # checked-in python/quip/v1/*_pb2.py were generated with 1.82.1 (protoc
    # gencode 7.35.0). A newer grpcio-tools stamps a different gencode version
    # and trips the diff. Bump this pin and regenerate the stubs together.
    - pip install -e ".[dev]" "grpcio-tools==1.82.1" numpy blake3 maturin
    # quip_proto's scoring/wire are a PyO3 extension; build it before tests
    # import it. python:3.11 has no Rust toolchain, so install one first.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - (cd python && maturin develop)
  script:
    # Golden vectors are frozen and validated through quip_proto (test_pyo3_parity);
    # the Python regeneration drift guard was retired with the v0.2 shared/ stack.
    # Proto↔stub drift guard: regenerate Python *_pb2 stubs from the normative
    # .proto and fail if the checked-in copies are stale (mirrors golden drift).
    - |
      set -e
      TMP=$(mktemp -d)
      python -m grpc_tools.protoc \
        -I proto \
        --python_out="$TMP" \
        --grpc_python_out="$TMP" \
        proto/quip/v1/miner.proto
      diff -u python/quip/v1/miner_pb2.py "$TMP/quip/v1/miner_pb2.py"
      diff -u python/quip/v1/miner_pb2_grpc.py "$TMP/quip/v1/miner_pb2_grpc.py"
    - PYTHONPATH=python python -m pytest conformance/ -v
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# v0.3 container images (separate v0.3/ namespace; see the stages note).
# Bundle: from-source quip-coordinator + released CPU/CUDA miner binaries +
# D-Wave Python miner. Manual on branches (heavy build), automatic on tags.
# ---------------------------------------------------------------------------
.image_base:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - docker buildx create --use --name quipci --driver docker-container --bootstrap 2>/dev/null || docker buildx use quipci
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

image-quip-miner:
  extends: .image_base
  variables:
    IMG: $CI_REGISTRY_IMAGE/v0.3/quip-miner
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx build --platform linux/amd64,linux/arm64 \
          -f docker/Dockerfile.quip-miner --build-arg MINERS_TAG="$TAG" \
          --build-arg QUIP_DOCKER_IMAGE="$IMG:$CI_COMMIT_TAG" \
          -t "$IMG:$CI_COMMIT_TAG" -t "$IMG:latest" --push .
      else
        docker buildx build --platform linux/amd64 \
          -f docker/Dockerfile.quip-miner --build-arg MINERS_TAG="$TAG" \
          -t "$IMG:$CI_COMMIT_SHORT_SHA" .
      fi

image-quip-miner-cuda:
  extends: .image_base
  variables:
    IMG: $CI_REGISTRY_IMAGE/v0.3/quip-miner-cuda
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx build --platform linux/amd64 \
          -f docker/Dockerfile.quip-miner-cuda --build-arg MINERS_TAG="$TAG" \
          --build-arg QUIP_DOCKER_IMAGE="$IMG:$CI_COMMIT_TAG" \
          -t "$IMG:$CI_COMMIT_TAG" -t "$IMG:latest" --push .
      else
        docker buildx build --platform linux/amd64 \
          -f docker/Dockerfile.quip-miner-cuda --build-arg MINERS_TAG="$TAG" \
          -t "$IMG:$CI_COMMIT_SHORT_SHA" .
      fi

# GitLab CI/CD for Quip Network Node
# Tests on branches; image + binary pushes on git tags ONLY

stages:
  - test
  - build
  - publish

# NOTE (v0.3 cutover): the v0.2 image/binary jobs were removed (they built the
# deleted Python monolith). The v0.3 images below live under a SEPARATE
# namespace (v0.3/) so they never touch the v0.2 :latest/:v0.2 tags that
# quip-node-manager tracks — the full cutover of those tags is deferred. Images
# bundle the released miner binaries + a from-source coordinator; the
# coordinator's production runtime is still being wired (quip-6ha/4kn/agm).

# ---------------------------------------------------------------------------
# Tests (branches only — main/tags skip straight to build)
# ---------------------------------------------------------------------------

# The v0.2 Python `test:` job (pytest tests/) was removed in the v0.3 cutover —
# the Python miner stack it exercised is gone. v0.3 coverage is `rust:` (the
# workspace) and `conformance:` (the quip_proto SDK).

rust:
  stage: test
  image: rust:1.97.1
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - cargo fmt --all --check
    - cargo clippy --workspace --exclude quip-coordinator --exclude quip-protocol-py --all-targets -- -D warnings
    - cargo test --workspace --exclude quip-coordinator --exclude quip-protocol-py
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [target/, .cargo/]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

conformance:
  stage: test
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    # quip-proto's build script (prost/tonic) needs protoc; python:3.11 has none.
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
    # maturin develop requires an active virtualenv; the base image has none.
    - python -m venv .venv
    - . .venv/bin/activate
    # Pin grpcio-tools so the proto-stub drift guard is deterministic: the
    # checked-in python/quip/v1/*_pb2.py were generated with 1.82.1 (protoc
    # gencode 7.35.0). A newer grpcio-tools stamps a different gencode version
    # and trips the diff. Bump this pin and regenerate the stubs together.
    - pip install maturin "grpcio-tools==1.82.1"
    # quip_proto's scoring/wire are a PyO3 extension; build it from the root
    # maturin project before tests import it, installing quip_proto + the dev
    # extras (pytest, numpy, blake3) into the venv. python:3.11 has no Rust
    # toolchain, so install one first.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - maturin develop -E dev
  script:
    # Golden vectors are frozen and validated through quip_proto (test_pyo3_parity);
    # the Python regeneration drift guard was retired with the v0.2 shared/ stack.
    # Proto↔stub drift guard: regenerate Python *_pb2 stubs from the normative
    # .proto and fail if the checked-in copies are stale (mirrors golden drift).
    - |
      set -e
      TMP=$(mktemp -d)
      python -m grpc_tools.protoc \
        -I proto \
        --python_out="$TMP" \
        --grpc_python_out="$TMP" \
        proto/quip/v1/miner.proto
      diff -u python/quip/v1/miner_pb2.py "$TMP/quip/v1/miner_pb2.py"
      diff -u python/quip/v1/miner_pb2_grpc.py "$TMP/quip/v1/miner_pb2_grpc.py"
    - python -m pytest conformance/ -v
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

# fetch-miners.sh is the single source of truth for pulling released miner
# binaries — the container images (Dockerfile.quip-miner*) and the native/host
# install both call it. This job lints it and dry-runs each MINER_SET, asserting
# the right assets are selected. DRY_RUN skips downloads, so it needs no cut
# releases and no GPU.
verify-fetch-miners:
  stage: test
  image: alpine:3.20
  tags: [linux, amd64]
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - shellcheck crates/quip-coordinator/tools/fetch-miners.sh
    - |
      set -eu
      S=crates/quip-coordinator/tools/fetch-miners.sh
      echo "--- MINER_SET=cpu ---"
      out=$(DRY_RUN=1 MINER_SET=cpu bash "$S")
      echo "$out"
      echo "$out" | grep -q 'quip-cpu-sa'
      echo "$out" | grep -q 'quip-cpu-gibbs'
      if echo "$out" | grep -q 'quip-cuda'; then echo "ERROR: cpu set pulled cuda"; exit 1; fi
      echo "--- MINER_SET=cpu-cuda ---"
      out=$(DRY_RUN=1 MINER_SET=cpu-cuda bash "$S")
      echo "$out"
      echo "$out" | grep -q 'quip-cpu-sa'
      echo "$out" | grep -q 'quip-cuda-sa'
      echo "--- clean-name (saved as quip-cpu-sa, not -amd64) ---"
      echo "$out" | grep -qE '\-> [^ ]+/quip-cpu-sa '
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# v0.3 container images (separate v0.3/ namespace; see the stages note).
# Bundle: from-source quip-coordinator + released CPU/CUDA miner binaries +
# D-Wave Python miner. Built the org-standard way (see quip-protocol-rs's
# quip-network-node): kaniko, one job per native architecture, stitched by
# manifest-tool. Build-only on branches (--no-push, manual), build + push on tags.
# ---------------------------------------------------------------------------
# The `docker` tag is load-bearing: it pins these to *container* executors that
# honour `image:` and can run kaniko. amd64 -> the Linux Docker boxes
# (finney/lovelace/watch); arm64 -> the arm64 docker-executor on an Apple-Silicon
# Mac (tesla-docker). The bare arch tags alone would hit the macOS *shell*
# runners, which ignore `image:` and can't run kaniko.
#
# amd64 /lib workaround: the amd64 boxes are NVIDIA GPU hosts whose runtime
# bind-mounts host firmware into /lib, so kaniko can't rewrite /lib into the
# base image's merged-usr symlink (EBUSY). Ignore /lib entirely, then re-shim
# the multilib triplet dir so each RUN still resolves its ELF interpreter (the
# shim dangles until kaniko unpacks the rootfs; it never reaches the image).
# NOT applied on arm64: no firmware mount, and the aarch64 ELF interpreter lives
# directly in /lib, so ignoring /lib would break every RUN.
.kaniko-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  timeout: 90m
  before_script:
    - if [ -n "$KANIKO_LIB_IGNORE" ]; then mkdir -p /lib && ln -sfn /usr/lib/$TRIPLET /lib/$TRIPLET; fi
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# quip-miner: one native kaniko build per arch, each pushing an arch-suffixed
# tag; the manifest job stitches them. Branch = --no-push (validate).
image-quip-miner-amd64:
  extends: .kaniko-image
  tags: [docker, amd64]
  variables:
    TRIPLET: x86_64-linux-gnu
    KANIKO_LIB_IGNORE: "--ignore-path=/lib"
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0-rc2}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      DEST="--destination $IMAGE:$REF-amd64"; [ -z "$CI_COMMIT_TAG" ] && DEST="--no-push"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.quip-miner" \
        --build-arg "MINERS_TAG=$TAG" \
        --build-arg "TARGETARCH=amd64" \
        --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $KANIKO_LIB_IGNORE \
        $DEST

image-quip-miner-arm64:
  extends: .kaniko-image
  tags: [docker, arm64]
  # The arm64 runner is a docker-executor on an Apple-Silicon Mac; a cold
  # coordinator + D-Wave venv compile can run long, and kaniko's default
  # compressed-caching OOMs that VM while snapshotting — disable it.
  timeout: 180m
  variables:
    KANIKO_EXTRA: "--compressed-caching=false"
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0-rc2}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      DEST="--destination $IMAGE:$REF-arm64"; [ -z "$CI_COMMIT_TAG" ] && DEST="--no-push"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.quip-miner" \
        --build-arg "MINERS_TAG=$TAG" \
        --build-arg "TARGETARCH=arm64" \
        --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $KANIKO_EXTRA \
        $DEST

# Stitch the per-arch images into the consumer-facing multi-arch tag (+ :latest).
# Tags only (needs the per-arch images pushed). manifest-tool substitutes ARCH.
image-quip-miner-manifest:
  stage: build
  image:
    name: mplatform/manifest-tool:alpine
    entrypoint: [""]
  tags: [docker, amd64]
  needs: [image-quip-miner-amd64, image-quip-miner-arm64]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"; REF="$CI_COMMIT_TAG"
      manifest-tool \
        --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
        push from-args \
        --platforms linux/amd64,linux/arm64 \
        --template "$IMAGE:$REF-ARCH" \
        --target "$IMAGE:$REF" \
        --tags "latest"

# quip-miner-cuda: amd64-only (nvidia/cuda base), single kaniko job on finney.
image-quip-miner-cuda:
  extends: .kaniko-image
  tags: [docker, amd64]
  variables:
    TRIPLET: x86_64-linux-gnu
    KANIKO_LIB_IGNORE: "--ignore-path=/lib"
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0-rc2}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner-cuda"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      DEST="--destination $IMAGE:$REF"
      [ -n "$CI_COMMIT_TAG" ] && DEST="$DEST --destination $IMAGE:latest"
      [ -z "$CI_COMMIT_TAG" ] && DEST="--no-push"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.quip-miner-cuda" \
        --build-arg "MINERS_TAG=$TAG" \
        --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $KANIKO_LIB_IGNORE \
        $DEST

# ---------------------------------------------------------------------------
# quip_proto distributions (tags only).
#
# quip-miner-dwave and anything else that consumes the Python SDK used to depend
# on `quip_proto @ git+...`, which makes every installing machine build the PyO3
# extension. maturin bootstraps a Rust toolchain on its own, but protoc it does
# not: a clean Apple Silicon `pip install` dies in quip-proto's build.rs with
# "Could not find `protoc`". These jobs publish quip_proto to this project's
# PyPI package registry instead.
#
# Two artifacts, because pyo3's abi3-py311 makes one wheel serve the whole
# supported range:
#   * quip_proto-<v>-cp311-abi3-macosx_11_0_arm64.whl — CPython 3.11+ on Apple
#     Silicon, no toolchain of any kind needed to install it.
#   * quip_proto-<v>.tar.gz — every other platform, which still compiles from
#     source exactly as it does today.
#
# The PyPI registry rather than the generic one: pip and uv resolve it natively
# from `--extra-index-url`, so the wheel-vs-sdist choice and the abi3/platform
# tag matching happen in the resolver. A generic-registry artifact would have to
# be named in the consumer's dependency as a direct URL with the wheel filename
# hard-coded, which breaks the moment the platform tag moves.
# ---------------------------------------------------------------------------

# The published version tracks the tag, because the registry rejects a re-upload
# of a version that already exists. pyproject.toml carries the release version
# (0.3.0); rewrite it to the PEP 440 spelling of the tag before building, so
# v0.3.0-rc3 publishes 0.3.0rc3 and the next rc does not collide.
.sdk-version:
  script:
    - |
      set -eu
      ver=$(printf '%s' "${CI_COMMIT_TAG#v}" | sed -E 's/-(rc|a|b)/\1/')
      sed -i.bak -E "s/^version = \".*\"/version = \"$ver\"/" pyproject.toml
      rm -f pyproject.toml.bak
      grep -m1 '^version' pyproject.toml

.sdk-dist:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Built on the group's Apple Silicon runners (`cray`, `tesla-arm`). Those are
# shell executors, so `image:` would be ignored and the toolchain is installed
# per job — same pattern as quip-miner-metal's `.macos`.
sdk-wheel-darwin-arm64:
  extends: .sdk-dist
  tags: [macos, arm64]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    # --no-modify-path: CARGO_HOME is inside the build directory, so the
    # `source $CARGO_HOME/env` line rustup appends to the runner's shell profile
    # would break every later login shell once the job is cleaned up.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --no-modify-path
    - source "$CARGO_HOME/env"
    # protobuf: quip-proto's build.rs runs protoc. python@3.12: abi3-py311 means
    # any interpreter >= 3.11 yields the same cp311-abi3 wheel, but the runner's
    # system python3 is below that floor.
    - brew install protobuf python@3.12
  script:
    - !reference [.sdk-version, script]
    - python3.12 -m venv .venv
    - . .venv/bin/activate
    - pip install -q --upgrade pip "maturin>=1,<2"
    - maturin build --release --out dist
    - ls -l dist/
    # Guard the premise of this job. A cp312-cp312 tag means the abi3-py311
    # feature stopped applying, and 3.11/3.13/3.14 users would silently fall
    # back to compiling from the sdist.
    - ls dist/ | grep -q 'cp311-abi3-macosx_.*_arm64\.whl$'
    # The wheel has to import with no toolchain in the picture, which is the
    # whole point of shipping it. Fresh venv, off the built artifact only.
    - deactivate
    - python3.12 -m venv .smoke
    - .smoke/bin/pip install -q --find-links dist quip_proto
    - .smoke/bin/python -c "from quip_proto import wire, scoring; assert wire.decode_spins(wire.encode_spins([1, -1])) == [1, -1]; print(scoring.energy_milli([1, -1], [0.5, -0.25], [1.5], [(0, 1)]))"

# The sdist covers every platform without a published wheel. maturin shells out
# to `cargo package --list`, so this needs cargo; it compiles nothing, so it
# needs no protoc.
sdk-sdist:
  extends: .sdk-dist
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - pip install -q "maturin>=1,<2"
  script:
    - !reference [.sdk-version, script]
    - maturin sdist --out dist
    - ls -l dist/
    # proto/ and python/quip/ live outside every crate, so `cargo package`
    # cannot see them and they are carried by [tool.maturin] include instead.
    # Without the .proto the sdist fails in build.rs; without the stubs it
    # installs and then fails on `import quip_proto`.
    - tar tzf dist/*.tar.gz | grep -q 'proto/quip/v1/miner.proto'
    - tar tzf dist/*.tar.gz | grep -q 'python/quip/v1/miner_pb2.py'

# Both artifacts land in the same dist/ on download, so one upload covers them.
publish-sdk:
  stage: publish
  image: python:3.11
  tags: [linux, amd64]
  needs: [sdk-wheel-darwin-arm64, sdk-sdist]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - pip install -q twine
    - ls -l dist/
    - twine check dist/*
    # gitlab-ci-token + CI_JOB_TOKEN is the registry's CI identity; the project
    # is public, so reads need no credentials at all.
    - >
      TWINE_USERNAME=gitlab-ci-token
      TWINE_PASSWORD="$CI_JOB_TOKEN"
      twine upload --non-interactive
      --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      dist/*

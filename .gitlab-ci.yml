# GitLab CI/CD for Quip Network Node
# Tests on branches; image + binary pushes on git tags ONLY

stages:
  - test
  - build

# NOTE (v0.3 cutover): the v0.2 image/binary jobs were removed (they built the
# deleted Python monolith). The v0.3 images below live under a SEPARATE
# namespace (v0.3/) so they never touch the v0.2 :latest/:v0.2 tags that
# quip-node-manager tracks — the full cutover of those tags is deferred. Images
# bundle the released miner binaries + a from-source coordinator; the
# coordinator's production runtime is still being wired (quip-6ha/4kn/agm).

# ---------------------------------------------------------------------------
# Tests (branches only — main/tags skip straight to build)
# ---------------------------------------------------------------------------

# The v0.2 Python `test:` job (pytest tests/) was removed in the v0.3 cutover —
# the Python miner stack it exercised is gone. v0.3 coverage is `rust:` (the
# workspace) and `conformance:` (the quip_proto SDK).

rust:
  stage: test
  image: rust:1.97
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - cd rust
    - cargo fmt --all --check
    - cargo clippy --workspace --exclude quip-coordinator --all-targets -- -D warnings
    - cargo test --workspace --exclude quip-coordinator
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [rust/target/, .cargo/]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

conformance:
  stage: test
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    # quip-proto's build script (prost/tonic) needs protoc; python:3.11 has none.
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
    # maturin develop requires an active virtualenv; the base image has none.
    - python -m venv .venv
    - . .venv/bin/activate
    # Pin grpcio-tools so the proto-stub drift guard is deterministic: the
    # checked-in python/quip/v1/*_pb2.py were generated with 1.82.1 (protoc
    # gencode 7.35.0). A newer grpcio-tools stamps a different gencode version
    # and trips the diff. Bump this pin and regenerate the stubs together.
    - pip install -e ".[dev]" "grpcio-tools==1.82.1" numpy blake3 maturin
    # quip_proto's scoring/wire are a PyO3 extension; build it before tests
    # import it. python:3.11 has no Rust toolchain, so install one first.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - (cd python && maturin develop)
  script:
    # Golden vectors are frozen and validated through quip_proto (test_pyo3_parity);
    # the Python regeneration drift guard was retired with the v0.2 shared/ stack.
    # Proto↔stub drift guard: regenerate Python *_pb2 stubs from the normative
    # .proto and fail if the checked-in copies are stale (mirrors golden drift).
    - |
      set -e
      TMP=$(mktemp -d)
      python -m grpc_tools.protoc \
        -I proto \
        --python_out="$TMP" \
        --grpc_python_out="$TMP" \
        proto/quip/v1/miner.proto
      diff -u python/quip/v1/miner_pb2.py "$TMP/quip/v1/miner_pb2.py"
      diff -u python/quip/v1/miner_pb2_grpc.py "$TMP/quip/v1/miner_pb2_grpc.py"
    - PYTHONPATH=python python -m pytest conformance/ -v
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# v0.3 container images (separate v0.3/ namespace; see the stages note).
# Bundle: from-source quip-coordinator + released CPU/CUDA miner binaries +
# D-Wave Python miner. Manual on branches (build-only, no push), automatic on
# tags (build + push :<tag> and :latest).
# ---------------------------------------------------------------------------
# Native per-arch on the macOS runners (docker buildx, real Linux VM), no
# emulation: linux/amd64 on the amd64 Mac, linux/arm64 on the arm64 Mac, then a
# manifest stitches them into one multi-arch tag. finney can't build images
# (kaniko dies on its GPU /lib/firmware mount; buildah's user namespace is
# seccomp-blocked on the unprivileged executor), so the amd64 Mac is our amd64
# builder. Shell-executor jobs: no `image:`; commands hit the Mac's daemon.
.image_base:
  stage: build
  before_script:
    # Per-job docker auth in a throwaway config dir. The shared Mac's default
    # config uses the osxkeychain cred store, and concurrent `docker login`s
    # collide on it ("item already exists in keychain"). A local config.json
    # with no credsStore keeps creds out of the keychain.
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker"
    - mkdir -p "$DOCKER_CONFIG" && printf '{}' > "$DOCKER_CONFIG/config.json"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# quip-miner: native per-arch, combined into a multi-arch manifest on tags.
# buildx sets TARGETARCH from --platform, so the Dockerfile picks the right
# CPU binaries. Branch = build + --load (validate); tag = --push per-arch tags.
image-quip-miner-amd64:
  extends: .image_base
  tags: [macos, amd64]
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      OUT="--load"; [ -n "$CI_COMMIT_TAG" ] && OUT="--push"
      docker buildx build --platform linux/amd64 \
        --file docker/Dockerfile.quip-miner --tag "$IMAGE:$REF-amd64" \
        --build-arg "MINERS_TAG=$TAG" --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $OUT "$CI_PROJECT_DIR"

image-quip-miner-arm64:
  extends: .image_base
  tags: [macos, arm64]
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      OUT="--load"; [ -n "$CI_COMMIT_TAG" ] && OUT="--push"
      docker buildx build --platform linux/arm64 \
        --file docker/Dockerfile.quip-miner --tag "$IMAGE:$REF-arm64" \
        --build-arg "MINERS_TAG=$TAG" --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $OUT "$CI_PROJECT_DIR"

# Stitch the per-arch images into one multi-arch tag. Tags only (needs the
# per-arch images pushed); combines into :<tag> and :latest.
image-quip-miner-manifest:
  extends: .image_base
  tags: [macos, amd64]
  needs: [image-quip-miner-amd64, image-quip-miner-arm64]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner"; REF="$CI_COMMIT_TAG"
      docker buildx imagetools create --tag "$IMAGE:$REF" --tag "$IMAGE:latest" \
        "$IMAGE:$REF-amd64" "$IMAGE:$REF-arm64"

# quip-miner-cuda: amd64-only (nvidia/cuda base), native on the amd64 Mac.
image-quip-miner-cuda:
  extends: .image_base
  tags: [macos, amd64]
  script:
    - |
      TAG="${CI_COMMIT_TAG:-v0.3.0}"; IMAGE="$CI_REGISTRY_IMAGE/v0.3/quip-miner-cuda"
      REF="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      TAGS="--tag $IMAGE:$REF"; OUT="--load"
      if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS --tag $IMAGE:latest"; OUT="--push"; fi
      docker buildx build --platform linux/amd64 \
        --file docker/Dockerfile.quip-miner-cuda $TAGS \
        --build-arg "MINERS_TAG=$TAG" --build-arg "QUIP_DOCKER_IMAGE=$IMAGE:$TAG" \
        $OUT "$CI_PROJECT_DIR"

# TEMPORARY diagnostic: does finney expose a Docker daemon we can build against
# (docker-outside-of-docker)? If `docker info` + the trivial build succeed,
# finney can build amd64 images with plain `docker build`. Remove after we know.
probe-finney:
  stage: build
  tags: [linux, amd64]
  image: docker:27-cli
  script:
    - 'echo "== id =="; id || true'
    - 'echo "== socket =="; ls -la /var/run/docker.sock 2>&1 || echo "NO SOCKET"'
    - 'echo "== docker version =="; docker version 2>&1 || echo "VERSION FAILED"'
    - 'echo "== docker info =="; docker info 2>&1 | head -15 || echo "INFO FAILED"'
    - 'echo "== buildx =="; docker buildx version 2>&1 || echo "NO BUILDX"'
    - 'echo "== trivial build =="; printf "FROM alpine\nRUN echo hi\n" > Dockerfile.probe; docker build -f Dockerfile.probe -t probe:test . 2>&1 | tail -15 || echo "BUILD FAILED"'
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

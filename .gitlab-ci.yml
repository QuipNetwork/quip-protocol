# GitLab CI/CD for Quip Network Node
# Tests on branches; image + binary pushes on git tags ONLY

stages:
  - test
  - build
  - release

variables:
  CPU_IMAGE: quip-miner-cpu
  CUDA_IMAGE: quip-miner-cuda

# ---------------------------------------------------------------------------
# Tests (branches only — main/tags skip straight to build)
# ---------------------------------------------------------------------------

test:
  stage: test
  image: python:3.12-slim
  tags: [linux, amd64]
  # Backstop only — must exceed (pip install + the inner 300s pytest
  # timeout) so the SIGABRT dump below fires first instead of a silent
  # job-level SIGTERM.
  timeout: 15m
  before_script:
    - pip install -U pip setuptools wheel
    - pip install -e ".[dev]"
  script:
    # Fast guard: the unified streaming stack has no inline path. Fail early
    # if the deleted _sample/_sample_batch/STREAMING_PUMP/DRIVER_OWNS_FEEDER
    # symbols reappear (also covered by pytest, but cheaper as a standalone).
    - python tools/lint_no_inline_sampling.py
    # Wrap pytest so a hang (e.g. a lingering non-daemon thread blocking
    # interpreter shutdown) produces a full all-thread stack dump rather
    # than a silent timeout. The suite is ~100s locally but 3-4x slower on
    # this shared runner — it's dominated by mp.Process(spawn) tests that
    # re-import the full dwave/scipy stack per child — so the budget is 300s
    # to leave headroom above the real run while still catching a genuine
    # post-summary shutdown hang. SIGABRT triggers faulthandler's all-thread
    # dump; the 30s --kill-after guarantees the job still exits if the dump
    # itself stalls.
    - timeout --signal=ABRT --kill-after=30 300 python -X faulthandler -m pytest tests/ -v
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Version-tag gate (tags only — fail fast if tag ≠ pyproject.toml version)
# ---------------------------------------------------------------------------

check-version:
  stage: test
  image: python:3.12-slim
  tags: [linux, amd64]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      PKG_VERSION=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      # Git tags use SemVer hyphenated pre-releases (0.2.1-rc17); pyproject uses
      # PEP 440 (0.2.1rc17). Normalize the tag to PEP 440 before comparing so the
      # numeric parts + rc number must still match. See docs/VERSIONING.md.
      TAG_VERSION_NORM=$(echo "$TAG_VERSION" | sed -E 's/-(rc|alpha|beta)/\1/')
      if [ "$PKG_VERSION" != "$TAG_VERSION_NORM" ]; then
        echo "ERROR: tag $CI_COMMIT_TAG (PEP440 ${TAG_VERSION_NORM}) != pyproject.toml version ${PKG_VERSION}"
        exit 1
      fi
      echo "OK: tag $CI_COMMIT_TAG matches pyproject.toml version $PKG_VERSION"

# ---------------------------------------------------------------------------
# Docker image builds (Kaniko — no daemon required)
# ---------------------------------------------------------------------------

# Shared trigger rules for image jobs. Image pushes happen ONLY on git tags —
# branch merges (main/v0.2) run tests but never push images.
#
# MUTABLE_TAGS is resolved at script time by the resolve-tags job (git ancestry
# cannot be tested in rules:if). Space-separated; each entry is an extra
# registry tag beyond the unconditional :$CI_COMMIT_SHA:
#   pre-release (vX.Y.Z-rcN or vX.Y.ZrcN)  -> :$CI_COMMIT_TAG only
#   stable vX.Y.Z reachable from origin/main -> :latest :vX.Y :$CI_COMMIT_TAG
#   stable vX.Y.Z NOT on main              -> :$CI_COMMIT_TAG only
#   any other tag                          -> :$CI_COMMIT_TAG only
.shared_image_rules:
  rules:
    # Pre-release — SemVer hyphenated (vX.Y.Z-rcN). Preferred form; see
    # docs/VERSIONING.md. Does not move :latest or :vX.Y.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(rc|alpha|beta)[0-9]*$/
    # Legacy pre-release — PEP 440 no-hyphen (vX.Y.ZrcN). Still builds.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc|alpha|beta)[0-9]*$/
    # Stable release tag (vX.Y.Z). Mutable tags decided by resolve-tags.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    # Any other tag: build and pin :$CI_COMMIT_TAG only (no :latest).
    - if: $CI_COMMIT_TAG

# Runtime ancestry gate: only stable tags reachable from origin/main publish
# :latest and :vX.Y. Exports MUTABLE_TAGS via dotenv for manifest/cuda jobs.
resolve-tags:
  stage: build
  needs: []
  rules: !reference [.shared_image_rules, rules]
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags: [linux, amd64]
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch origin main
    - |
      MUTABLE_TAGS="$CI_COMMIT_TAG"
      if printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
         && git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        MINOR=$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
        MUTABLE_TAGS="latest $MINOR $CI_COMMIT_TAG"
      fi
      echo "MUTABLE_TAGS=$MUTABLE_TAGS" > tags.env
      echo "resolved MUTABLE_TAGS=$MUTABLE_TAGS"
  artifacts:
    reports:
      dotenv: tags.env

.docker_build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # The cuda runners' NVIDIA container runtime bind-mounts host GPU driver
    # firmware into every job container at /lib/firmware/nvidia/. kaniko's
    # rootfs extraction cannot replace /lib with the usr-merge symlink while
    # those mounts are busy, so the executor runs with --ignore-path=/lib,
    # which skips that replacement and preserves /lib as a plain directory.
    # The ELF interpreter resolves through /lib/x86_64-linux-gnu (via the
    # /lib64 → /usr/lib64 → /lib/x86_64-linux-gnu symlink chain), so RUN
    # commands need this shim. It dangles until kaniko unpacks the rootfs,
    # and never reaches the image: /lib is excluded from snapshots and the
    # final image's /lib symlink comes from the base layers.
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
  rules: !reference [.shared_image_rules, rules]

# CPU image — built per-arch then stitched into a multi-arch manifest.
# amd64 stays on a linux/amd64 runner via Kaniko (daemonless).
# arm64 runs on the macOS arm64 shell runner via docker buildx — we
# don't have a dedicated linux/arm64 runner today, and the mac runner
# builds natively (no QEMU) so it's fast and isolates us from the
# linux-arm64 pool being empty. Swap back to a Kaniko-on-linux-arm64
# job when a real runner comes online.

build-cpu-amd64:
  extends: .docker_build
  tags: [linux, amd64]
  script:
    # --ignore-path=/lib: paired with the /lib/x86_64-linux-gnu shim in the
    # .docker_build before_script — see the comment there.
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile docker/Dockerfile.cpu
        --build-arg QUIP_DOCKER_IMAGE=$CI_REGISTRY_IMAGE/$CPU_IMAGE:$CI_COMMIT_SHA
        --destination $CI_REGISTRY_IMAGE/$CPU_IMAGE:$CI_COMMIT_SHA-amd64
        --ignore-path=/lib

build-cpu-arm64:
  stage: build
  tags: [macos, arm64]
  rules: !reference [.shared_image_rules, rules]
  before_script:
    # Isolated buildx builder per project. Create-if-missing is
    # idempotent across job retries. docker-container driver is
    # required for --push to push in one invocation.
    - docker buildx inspect quip-ci >/dev/null 2>&1 || docker buildx create --name quip-ci --driver docker-container --bootstrap
    - docker buildx use quip-ci
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker buildx build
      --platform linux/arm64
      --push
      -t "$CI_REGISTRY_IMAGE/$CPU_IMAGE:$CI_COMMIT_SHA-arm64"
      -f docker/Dockerfile.cpu
      --build-arg "QUIP_DOCKER_IMAGE=$CI_REGISTRY_IMAGE/$CPU_IMAGE:$CI_COMMIT_SHA"
      .
  after_script:
    - docker logout "$CI_REGISTRY" || true

manifest-cpu:
  stage: build
  image:
    name: mplatform/manifest-tool:alpine-v2.2.1
    entrypoint: [""]
  tags: [linux, amd64]
  needs:
    - resolve-tags
    - build-cpu-amd64
    - build-cpu-arm64
  rules: !reference [.shared_image_rules, rules]
  script:
    # Immutable SHA target, then one mutable target per MUTABLE_TAGS entry.
    - |
      for target in "$CI_COMMIT_SHA" $MUTABLE_TAGS; do
        manifest-tool \
          --username "$CI_REGISTRY_USER" \
          --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$CI_REGISTRY_IMAGE/$CPU_IMAGE:$CI_COMMIT_SHA-ARCH" \
          --target "$CI_REGISTRY_IMAGE/$CPU_IMAGE:$target"
      done

build-cuda:
  extends: .docker_build
  tags: [linux, amd64]
  needs:
    - resolve-tags
  script:
    # Immutable SHA destination, then one --destination per MUTABLE_TAGS entry.
    - |
      DESTINATIONS="--destination $CI_REGISTRY_IMAGE/$CUDA_IMAGE:$CI_COMMIT_SHA"
      for tag in $MUTABLE_TAGS; do
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE/$CUDA_IMAGE:$tag"
      done
      # --ignore-path=/lib: paired with the /lib/x86_64-linux-gnu shim in the
      # .docker_build before_script — see the comment there.
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile docker/Dockerfile.cuda \
        --build-arg QUIP_DOCKER_IMAGE=$CI_REGISTRY_IMAGE/$CUDA_IMAGE:$CI_COMMIT_SHA \
        $DESTINATIONS \
        --ignore-path=/lib

# ---------------------------------------------------------------------------
# PyInstaller native binaries
# ---------------------------------------------------------------------------

.pyinstaller_build:
  stage: build
  variables:
    PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
  script:
    - bash pyinstaller/build.sh
  artifacts:
    paths:
      - dist/quip-miner-*
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

package-macos-arm64:
  extends: .pyinstaller_build
  tags: [macos, arm64]
  before_script:
    - rm -rf .venv-arm64
    - /opt/homebrew/bin/python3.13 -m venv .venv-arm64
    - source .venv-arm64/bin/activate
    - pip install -U pip setuptools wheel
    - pip install pyinstaller
    - pip install -e ".[metal]"

# ---------------------------------------------------------------------------
# Release (tags only)
# ---------------------------------------------------------------------------

release-binaries:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [linux, amd64]
  needs:
    - package-macos-arm64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: quip-miner-macos-arm64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/quip-miner-macos-arm64?job=package-macos-arm64"
          filepath: /quip-miner-macos-arm64

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The v0.2 Python miner stack (CPU/ GPU/ QPU/ shared/ substrate/ quip_cli.py)
# was removed in the v0.3 cutover: the miners live in their own repos
# (quip.network/quip-miner-*) and the coordinator + chain integration are Rust
# (rust/). This root package now only pins the Python dev/conformance
# dependencies; the v0.3 SDK is python/quip_proto (built by maturin).
[project]
name = "quip-protocol"
version = "0.3.0"
description = "quip.network v0.3 workspace: Rust crates (rust/) + quip_proto SDK (python/). Python dev/conformance deps only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "numpy>=1.24.0",
    "blake3>=1.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23.0"]

# No packages: the SDK (quip_proto + quip.v1 stubs) is installed via
# `maturin develop` from python/; nothing here is importable on its own.
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

# The v0.2 Python miner stack was removed in the v0.3 cutover: the miners live in
# their own repos (quip.network/quip-miner-*) and the coordinator + chain
# integration are Rust (crates/). This is the v0.3 SDK: PyO3 consensus primitives
# (crates/quip-protocol-py -> quip_proto._core) plus the generated gRPC stubs
# (python/quip/v1). The Rust is the source of truth; Python cannot drift from it.
[project]
name = "quip_proto"
version = "0.3.0"
description = "quip.network v0.3 SDK: PyO3 consensus primitives + generated gRPC stubs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.82.1", "protobuf>=7.35.1,<8"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23.0", "numpy>=1.24", "blake3>=1.0.5"]

[tool.maturin]
manifest-path = "crates/quip-protocol-py/Cargo.toml"
python-source = "python"
module-name = "quip_proto._core"
features = ["pyo3/extension-module"]
# maturin auto-bundles the package matching module-name (quip_proto). The
# generated gRPC stubs live in the sibling `quip` package (python/quip), which
# quip_proto/__init__.py imports; include it so the wheel is self-contained.
#
# The sdist needs two more things that `cargo package` cannot reach, because
# both live outside every crate directory: the same gRPC stubs (wheel include
# paths are relative to python-source, sdist ones to the project root), and
# proto/quip/v1/miner.proto, which quip-proto's build.rs compiles through
# tonic-build via a ../../ path. Without them `pip install` of the sdist fails
# in build.rs with "Could not make proto path relative".
include = [
    { path = "quip/**/*.py", format = "wheel" },
    { path = "python/quip/**/*.py", format = "sdist" },
    { path = "proto/**/*.proto", format = "sdist" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# quip-miner cpu — v0.2 example config
#
#   quip-miner cpu --config ./quip.network.cpu.example.toml
#
# Pure CPU simulated-annealing miner. Fastest path to get a miner
# producing PoW proofs against a substrate validator without any
# GPU/QPU hardware.

[miner]
validators = [
    "ws://quip-validator:9944",
]
signer_key = "~/.quip-miner/signing.json"
# faucet_url = "http://localhost:8087"

# Optional telemetry REST API. Off by default (rest_port=-1). Set
# rest_host = "0.0.0.0" to expose inside a container; CLI flags
# --rest-port / --rest-host override these.
# rest_port = 8086
# rest_host = "127.0.0.1"

# The [miner.cpu] subtable is documented here for forward-compat —
# Phase 6+ will merge it into the per-command miner_config. For now,
# use the CLI flags shown below.
[miner.cpu]
# num_cpus = 4   # CLI: --num-cpus N

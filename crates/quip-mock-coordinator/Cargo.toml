[package]
name = "quip-mock-coordinator"
version = "0.3.0"
edition = "2021"

[lib]
name = "quip_mock_coordinator"
path = "src/lib.rs"

[[bin]]
name = "quip-mock-coordinator"
path = "src/main.rs"

[dependencies]
quip-proto = { path = "../quip-proto" }
quip-protocol = { path = "../quip-protocol" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }

[lints]
workspace = true

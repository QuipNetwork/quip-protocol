# quip-miner — Systemd (Bare-Metal Linux) Configuration
# Installed to /etc/quip.network/config.toml by install.sh

[miner]
# Ordered failover list — tried in order at startup, live-rotated on
# disconnect. Required. CLI: --validator URL (repeatable).
validators = [
    # "wss://validator-1.quip.network/rpc",
    # "wss://validator-2.quip.network/rpc",
]

# Hybrid sr25519 + ML-DSA-44 keystore. install.sh generates one at
# this path the first time it runs. CLI: --signer-key PATH.
signer_key = "/var/lib/quip.network/keystore.json"

# Optional faucet bot for auto-topup. Without this, an underfunded
# wallet fails fast with `wallet-underfunded`. CLI: --faucet-url URL.
# faucet_url = "http://faucet.quip.network"

# Telemetry REST API. Disabled by default. Leave bound to loopback
# in bare-metal deployments — front with nginx/Caddy if exposing.
rest_port = -1
rest_host = "127.0.0.1"

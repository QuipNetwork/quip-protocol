# quip-miner example config — v0.2 schema
#
# Use with any quip-miner subcommand:
#   quip-miner cpu --config ./quip-miner.example.toml
#   quip-miner gpu --config ./quip-miner.example.toml
#   quip-miner qpu --config ./quip-miner.example.toml
#
# Two slices of this file are read by separate loaders:
#
#   * `[miner]` — connection / keystore / telemetry / identification.
#     CLI flags override these on a per-key basis (CLI > TOML); empty
#     CLI values fall back to TOML so `--config defaults.toml` + a
#     single override flag is a valid per-run pattern.
#
#   * `[cpu]` / `[gpu]` / `[cuda.N]` / `[nvidia.N]` / `[metal]` /
#     `[modal]` / `[qpu]` / `[dwave]` / `[ibm]` / `[braket]` /
#     `[pasqal]` / `[ionq]` / `[origin]` — hardware inventory in the
#     v0.1 layout. The matching CLI subcommand (`cpu`/`gpu`/`qpu`)
#     reads the relevant group. TOML + a conflicting CLI flag fail
#     fast with `config-conflict` — pick one source per backend group.

[miner]
# Ordered failover list — tried in order at startup, live-rotated on
# disconnect. Set at least one. CLI: --validator URL (repeatable).
validators = [
    "ws://quip-validator:9944",
    # "wss://validator-2.quip.network/rpc",
]

# Path to the sr25519 + ML-DSA-44 hybrid keystore. Create with:
#   quip-miner keygen --out ~/.quip-miner/signing.json
# CLI: --signer-key PATH
signer_key = "~/.quip-miner/signing.json"

# Work source: "pow" (chain heads, default), "mempool"
# (QuantumComputeMempool jobs), or "both" (split workers; needs ≥2
# handles). CLI: --mode overrides.
# mode = "pow"

# Optional. When set, an underfunded wallet is topped up through this
# faucet bot at startup instead of failing fast. Leave commented out
# in production (the faucet is dev-only).
# faucet_url = "http://localhost:8087"

# Optional telemetry REST API (/api/v1/*). Off by default (rest_port=-1).
# Set rest_host = "0.0.0.0" to expose on all interfaces inside a container.
# CLI: --rest-port N / --rest-host HOST override these.
# rest_port = 8086
# rest_host = "127.0.0.1"

# v0.1 compatibility aliases. `listen` maps to rest_host, `port` to
# rest_port. If both an alias and its canonical key are present, the
# canonical key wins.
# listen = "0.0.0.0"
# port   = 8086

# Identification metadata — published on every miner startup as a
# signed MinerRegistry NodeDescriptor. Dashboards
# index miners by AccountId; these fields are the human-readable
# overlay. Failures log a warning and never block mining.
#
# node_name defaults to the system hostname; set this if you want a
# stable label across deployments.
#
# public_host is auto-detected on startup via check.quip.network (with
# ipify / icanhazip / checkip.amazonaws.com / ident.me as fallbacks)
# when this key is unset and no --public-host flag is passed. Set
# explicitly to skip the probe — required when the host is behind a
# NAT/load-balancer whose external address differs from what those
# services see, or in air-gapped environments.
# node_name   = "rig-01"
# public_host = "miner.example.com"
# public_port = 8086

# Logging.
# log_level (DEBUG/INFO/WARNING/ERROR) — defaults to INFO via the
# top-level --log-level flag.
# node_log — path to a rotating log file (10MB × 5 backups) attached
# alongside the stderr handler. Useful for systemd-managed deployments
# that want a stable log location separate from journald.
# log_level = "INFO"
# node_log  = "/var/log/quip-miner.log"


# ──────────────────────────────────────────────────────────────────────
# Hardware inventory (v0.1-shape backend tables).
#
# Uncomment the section(s) for the hardware this rig actually runs.
# When a section is present, the matching `quip-miner <cmd>` subcommand
# reads it instead of synthesizing inventory from CLI flags. Passing a
# CLI flag that would override (`--num-cpus`, `--gpu-backend`,
# `--qpu-type`, `--daily-budget`) when the corresponding TOML section
# is set raises `config-conflict`.
# ──────────────────────────────────────────────────────────────────────

# CPU SA worker pool. Read by `quip-miner cpu`.
# [cpu]
# num_cpus = 4   # number of SA workers; defaults to 1 when [cpu] is unset

# GPU global defaults inherited by each per-device section below.
# Read by `quip-miner gpu` alongside `[cuda.N]` / `[metal]` / `[modal]`.
# [gpu]
# utilization   = 100   # 1-100, percentage of SMs to use
# yielding      = false # true = yield to other GPU users between batches
# sms_per_nonce = 4     # CUDA-only; tunes per-streaming-multiprocessor scheduling

# CUDA / NVIDIA per-device sections. One subtable per device ordinal.
# `[nvidia.N]` is an alias for `[cuda.N]`. Discover ordinals with:
#   nvidia-smi --query-gpu=index,name --format=csv,noheader
# [cuda.0]
# [cuda.1]
# utilization = 50
# yielding    = true

# Apple Silicon (Metal Performance Shaders). Single GPU per node.
# [metal]
# utilization = 100          # IDLE/headless cap — flat-out when nobody's here
#
# Interactive profile — responsive Mac while mining. `yielding` (default on)
# enables the adaptive cap monitor (HID-idle / thermal / battery / display
# sensing). While present it caps GPU occupancy (concurrent threads per command
# buffer) to `active_util` % of the GPU's max thread capacity; idle/headless
# runs flat-out; auto-pauses on battery / critical thermal. Total reads and
# sweeps are preserved.
# yielding     = true
# active_util  = 85          # % of max GPU threads while present (default 85)
# idle_after_s = 60          # seconds of no input before going flat-out

# Modal cloud GPUs. Set `gpu_type` to the Modal class (t4, a10g, …).
# [modal]
# gpu_type = "a10g"

# QPU global defaults — currently no shared keys; vendor sections below
# carry all settings. Reserved for future inheritance.
# [qpu]

# D-Wave annealer. Credentials come from environment vars
# (DWAVE_API_KEY) — never store them in this file.
# [dwave]
# daily_budget                   = "60s"   # wall-clock QPU access budget per UTC day
# solver                         = "Advantage2_system1"
# region                         = "na-west-1"   # D-Wave region NAME, not a URL
# qpu_min_blocks_for_estimation  = 5
# qpu_ema_alpha                  = 0.3

# Gate-model providers — token from environment, never inline.
# [ibm]
# token        = "..."  # IBMQ_TOKEN
# daily_budget = "5m"

# [braket]
# token        = "..."  # AWS credentials via boto3 profile in practice
# daily_budget = "5m"

# [pasqal]
# token        = "..."  # PASQAL_TOKEN
# daily_budget = "5m"

# [ionq]
# token        = "..."  # IONQ_API_KEY
# daily_budget = "5m"

# [origin]
# token        = "..."  # ORIGIN_TOKEN
# daily_budget = "5m"

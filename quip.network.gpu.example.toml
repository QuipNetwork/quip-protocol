# quip-miner gpu — v0.2 example config
#
#   quip-miner gpu --config ./quip.network.gpu.example.toml
#
# CUDA / Apple Metal / Modal Labs cloud. Uncomment whichever device
# section(s) describe this rig. Passing `--gpu-backend` on the command
# line when any GPU device section is set in this file raises
# `config-conflict` — pick one source for the inventory.

[miner]
validators = [
    "ws://quip-validator:9944",
]
signer_key = "~/.quip-miner/signing.json"
# On the public testnet the miner defaults to the canonical faucet when
# faucet_url is unset; set it only to override (e.g. a local dev faucet).
# faucet_url = "https://faucet.testnet.quip.network"

# Optional telemetry REST API. Off by default (rest_port=-1). Set
# rest_host = "0.0.0.0" to expose inside a container; CLI flags
# --rest-port / --rest-host override these.
# rest_port = 8086
# rest_host = "127.0.0.1"

# Global GPU defaults — inherited by every device section below.
# Per-device sections override individual keys.
[gpu]
utilization   = 100    # 1-100, percentage of SMs to use per worker
yielding      = false  # true = yield to other GPU users between batches
# sms_per_nonce = 4    # CUDA-only; per-streaming-multiprocessor scheduling

# ── CUDA / NVIDIA ─────────────────────────────────────────────────────
# One subtable per device ordinal. Discover with:
#   nvidia-smi --query-gpu=index,name --format=csv,noheader
# `[nvidia.N]` is accepted as an alias for `[cuda.N]`.
[cuda.0]
[cuda.1]
# utilization = 50
# yielding    = true

# ── Apple Silicon (Metal) ─────────────────────────────────────────────
# Uncomment for Apple Silicon rigs. Single GPU per node.
# [metal]
# utilization = 100          # IDLE/headless cap — flat-out when nobody's here
#
# Interactive profile — keep an interactive Mac responsive while mining.
# `yielding` is on by default (the adaptive cap monitor: HID-idle / thermal /
# battery / display sensing). While you're present it caps GPU *occupancy*
# (concurrent threads per command buffer) to `active_util` percent of the GPU's
# max thread capacity (maxTotalThreadsPerThreadgroup x cores); idle/headless
# runs flat-out; battery / critical thermal pause automatically. Total reads
# and sweeps are always preserved.
# yielding     = true        # master enable for the adaptive cap (default on)
# active_util  = 85          # % of max GPU threads while present (default 85;
#                            # lower if a weaker Mac stutters)
# idle_after_s = 60          # seconds of no input before going flat-out

# ── Modal cloud GPU ───────────────────────────────────────────────────
# Uncomment for Modal-hosted cloud GPUs. `gpu_type` picks the class
# (t4, a10g, a100, etc. — see Modal's catalog).
# [modal]
# gpu_type = "a10g"

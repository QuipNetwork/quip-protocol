# quip-miner gpu — v0.2 example config
#
#   quip-miner gpu --config ./quip.network.gpu.example.toml --gpu-backend local
#   quip-miner gpu --config ./quip.network.gpu.example.toml --gpu-backend metal
#   quip-miner gpu --config ./quip.network.gpu.example.toml --gpu-backend modal
#
# CUDA / Apple Metal / Modal Labs cloud — pick a backend on the CLI.

[miner]
validators = [
    "ws://quip-validator:9944",
]
signer_key = "~/.quip-miner/signing.json"
# faucet_url = "http://localhost:8087"

# Optional telemetry REST API. Off by default (rest_port=-1). Set
# rest_host = "0.0.0.0" to expose inside a container; CLI flags
# --rest-port / --rest-host override these.
# rest_port = 8086
# rest_host = "127.0.0.1"

# Forward-compat subtable for Phase 6+. Today the GPU miner config is
# driven entirely by --gpu-backend on the CLI.
[miner.gpu]
# backend = "metal"   # local | metal | modal

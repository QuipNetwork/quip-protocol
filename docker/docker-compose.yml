# Docker Compose for quip-miner (v0.2 substrate-attached).
#
# Run:  docker compose -f docker/docker-compose.yml up cpu-miner
#       docker compose -f docker/docker-compose.yml up gpu-miner
#
# All miner configuration lives in the volume's config.toml (seeded
# from the image template on first run) — validators, mempool, identity,
# backend inventory. Edit it and `docker compose restart`.
#
# File ownership: the container drops from root to the in-container
# `quip` user (uid 1000 by default) before launching the miner, so
# files under /data are host-readable without sudo. To match your
# host uid/gid, set PUID and PGID on each service, e.g.:
#   environment:
#     - PUID=${UID:-1000}
#     - PGID=${GID:-1000}
# Set PUID=0 to keep legacy root-mode (skips drop + chown).

services:
  cpu-miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    image: registry.gitlab.com/quip.network/quip-protocol/quip-miner-cpu:latest
    container_name: quip-miner-cpu
    volumes:
      - cpu-miner-data:/data
    networks:
      - quip-net

  gpu-miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cuda
    image: registry.gitlab.com/quip.network/quip-protocol/quip-miner-cuda:latest
    container_name: quip-miner-gpu
    volumes:
      - gpu-miner-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - quip-net

networks:
  quip-net:
    driver: bridge

volumes:
  cpu-miner-data:
  gpu-miner-data:

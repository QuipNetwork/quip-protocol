# quip-miner qpu — v0.2 example config
#
#   quip-miner qpu --config ./quip.network.qpu.example.toml --qpu-type dwave
#
# Quantum-annealer / gate-model providers. Credentials come from
# environment variables (e.g. DWAVE_API_KEY) — never store them in
# this file.

[miner]
validators = [
    "ws://quip-validator:9944",
]
signer_key = "~/.quip-miner/signing.json"
# faucet_url = "http://localhost:8087"

# Optional telemetry REST API. Off by default (rest_port=-1). Set
# rest_host = "0.0.0.0" to expose inside a container; CLI flags
# --rest-port / --rest-host override these.
# rest_port = 8086
# rest_host = "127.0.0.1"

# Forward-compat for Phase 6+. Today the QPU miner config is driven by
# the CLI:
#   --qpu-type     {dwave,ibm,ionq,pasqal,braket,origin}
#   --daily-budget {e.g. 40s, 5m, 2h, 1d}  — wall-clock QPU access budget
[miner.qpu]
# type = "dwave"
# daily_budget = "40s"
